<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouquet</title>
<style>
  html, body { margin: 0; height: 100%; background: #f4f1ec; font-family: Georgia, "Times New Roman", serif; color: #3a2f2a; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 20px 24px; pointer-events: none; z-index: 2; }
  h1 { margin: 0; font-weight: normal; font-size: 1.6rem; letter-spacing: .02em; }
  p { margin: 4px 0 0; font-size: .9rem; opacity: .65; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 1rem; opacity: .7; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; padding: 14px 24px; font-size: .8rem; opacity: .55; pointer-events: none; z-index: 2; }
</style>
</head>
<body>
<div id="view"></div>
<header>
  <h1>Bouquet</h1>
  <p>Reconstructed in 3D from 87 photographs</p>
</header>
<div id="loading">Loading…</div>
<footer>Drag to rotate · scroll or pinch to zoom</footer>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.178.0/examples/jsm/",
  "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@0.1.10/dist/spark.module.js"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { SplatMesh, SplatFileType } from "@sparkjsdev/spark";

const el = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
el.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f1ec);

// Splat is Z-up, vase base at the origin, bouquet height = 1.
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);
camera.up.set(0, 0, 1);
camera.position.set(0, -2.3, 0.75);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0.47);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 0.8;
controls.maxDistance = 6;
controls.addEventListener("start", () => (controls.autoRotate = false));

const bouquet = new SplatMesh({ url: "bouquet.splat", fileType: SplatFileType.SPLAT });
scene.add(bouquet);
bouquet.initialized
  .then(() => document.getElementById("loading").remove())
  .catch(() => (document.getElementById("loading").textContent = "Could not load bouquet.splat"));

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
